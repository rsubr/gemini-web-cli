name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out="gemini-web-cli-${GOOS}-${GOARCH}"
          go build -buildvcs=false -trimpath -ldflags "-s -w" -o "dist/${out}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gemini-web-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/gemini-web-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Compute CalVer tag (YY.MM.NN)
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prefix="$(date -u +%y.%m)"
          last="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[].tag_name' \
                  | grep -E "^${prefix}\.[0-9]+$" \
                  | sed -E "s/^${prefix}\.//" \
                  | sort -n | tail -1 || true)"
          next="$(printf '%02d' "$(( ${last:-0} + 1 ))")"
          echo "tag=${prefix}.${next}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${prefix}.${next}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l dist
          gh release create "${{ steps.ver.outputs.tag }}" \
            --target "${GITHUB_SHA}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --generate-notes \
            dist/gemini-web-cli-linux-amd64 \
            dist/gemini-web-cli-linux-arm64
