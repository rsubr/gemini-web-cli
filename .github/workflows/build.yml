name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          out="gemini-web-cli-${GOOS}-${GOARCH}"
          go build -buildvcs=false -trimpath -ldflags "-s -w" -o "dist/${out}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gemini-web-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/gemini-web-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
